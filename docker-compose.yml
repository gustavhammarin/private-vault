services:
  node1:
    build: .
    container_name: vault-rs-node1
    environment:
      NODE_ID: node1
      PORT: 8080
      STORAGE_PATH: /data
      PEERS: http://node2:8080,http://node3:8080
    ports:
      - "8081:8080"
    volumes:
      - ./data/node1:/data

  node2:
    build: .
    container_name: vault-rs-node2
    environment:
      NODE_ID: node2
      PORT: 8080
      STORAGE_PATH: /data
      PEERS: http://node1:8080,http://node3:8080
    ports:
      - "8082:8080"
    volumes:
      - ./data/node2:/data

  node3:
    build: .
    container_name: vault-rs-node3
    environment:
      NODE_ID: node3
      PORT: 8080
      STORAGE_PATH: /data
      PEERS: http://node1:8080,http://node2:8080
    ports:
      - "8083:8080"
    volumes:
      - ./data/node3:/data